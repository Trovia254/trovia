{% extends "base.html" %}
{% block title %}404 – Page Not Found | Trovia{% endblock %}
{% block content %}
<section class="min-h-screen flex items-center justify-center py-24">
  <div class="text-center px-4">
    <p class="text-8xl font-bold text-teal-700 dark:text-teal-400 opacity-30">404</p>
    <h1 class="mt-4 text-3xl font-bold text-gray-900 dark:text-white">Page not found</h1>
    <p class="mt-3 text-gray-500 dark:text-gray-400 max-w-sm mx-auto">The page you're looking for has moved, or maybe it never existed. Let's get you back on the right path.</p>
    <div class="mt-8 flex gap-4 justify-center">
      <a href="{% url 'core:home' %}" class="px-6 py-3 bg-teal-700 hover:bg-teal-600 text-white font-semibold rounded-full transition-all hover:scale-105">Back to Home</a>
      <a href="{% url 'core:contact' %}" class="px-6 py-3 border border-gray-300 dark:border-slate-600 text-gray-700 dark:text-gray-300 font-semibold rounded-full hover:border-teal-400 transition-colors">Contact us</a>
    </div>
  </div>
</section>
{% endblock %}
